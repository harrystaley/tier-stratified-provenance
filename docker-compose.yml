# docker-compose.yml — backing services for Flowcept
# Usage: docker compose up -d redis mongo   (add 'neo4j' if you want graph traversal)
#
# Flowcept's default persistence is MongoDB; Redis is the message queue.
# Neo4j is optional and only relevant to the (future-work) backward-traversal path.

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Optional: only if you experiment with graph-traversal queries.
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/changeme   # change before any non-local use
    volumes:
      - neo4j-data:/data

volumes:
  mongo-data:
  neo4j-data:
